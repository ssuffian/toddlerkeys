name: Release Linux app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag, such as v0.1.0
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: linux-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run make:linux -- --arch=${{ matrix.arch }}

      - name: Give the download a stable name
        run: |
          mkdir -p out/release
          cp out/make/deb/${{ matrix.arch }}/*.deb out/release/Toddler-Keys-Linux-${{ matrix.arch }}.deb

      - uses: actions/upload-artifact@v4
        with:
          name: Toddler-Keys-Linux-${{ matrix.arch }}
          path: out/release/Toddler-Keys-Linux-${{ matrix.arch }}.deb

      - name: Attach download to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" out/release/Toddler-Keys-Linux-${{ matrix.arch }}.deb --clobber

  publish-apt-repository:
    name: Publish signed APT repository
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Toddler-Keys-Linux-*
          path: out/release
          merge-multiple: true

      - name: Import repository signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Build signed repository
        run: ./scripts/build-apt-repository.sh out/release out/apt-site packaging/apt/toddlerkeys-archive-keyring.gpg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/apt-site

      - name: Publish repository
        id: deployment
        uses: actions/deploy-pages@v4
