name: Release Linux app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, such as v0.1.4
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: linux-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare shared release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Requested $RELEASE_TAG, but main contains $EXPECTED_TAG." >&2
            exit 1
          fi

      - name: Create release when Linux publishes first
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes --title "Toddler Keys $RELEASE_TAG"
          fi

  build:
    name: Linux ${{ matrix.arch }}
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run make:linux -- --arch=${{ matrix.arch }}

      - name: Give the download a stable name
        run: |
          mkdir -p out/release
          cp out/make/deb/${{ matrix.arch }}/*.deb out/release/Toddler-Keys-Linux-${{ matrix.arch }}.deb

      - uses: actions/upload-artifact@v4
        with:
          name: Toddler-Keys-Linux-${{ matrix.arch }}
          path: out/release/Toddler-Keys-Linux-${{ matrix.arch }}.deb

      - name: Attach download to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" out/release/Toddler-Keys-Linux-${{ matrix.arch }}.deb --clobber

  publish-apt-repository:
    name: Publish signed APT repository
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Toddler-Keys-Linux-*
          path: out/release
          merge-multiple: true

      - name: Import repository signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Build signed repository
        run: ./scripts/build-apt-repository.sh out/release out/apt-site packaging/apt/toddlerkeys-archive-keyring.gpg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/apt-site

      - name: Publish repository
        id: deployment
        uses: actions/deploy-pages@v4
